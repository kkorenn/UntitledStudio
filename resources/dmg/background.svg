<?xml version="1.0" encoding="UTF-8"?>
<!-- Untitled Studio installer (DMG) window background, 660x420. Original artwork.
     scripts/package-macos.sh replaces {{VERSION}} and renders 1x + 2x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353d43"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb466"/>
      <stop offset="1" stop-color="#f07a1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="660" height="420" fill="url(#bg)"/>
  <rect width="660" height="420" fill="url(#grid)"/>

  <!-- soft glows behind where Finder draws the two icons (centres at 170,215 and 490,215) -->
  <circle cx="170" cy="200" r="120" fill="url(#glow)"/>
  <circle cx="490" cy="200" r="120" fill="url(#glow)"/>

  <!-- header -->
  <g transform="translate(36 30)">
    <path d="M 7 4 V 16 A 10 10 0 0 0 27 16 V 4" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="27" cy="4" r="3" fill="#7cd85a"/>
  </g>
  <text x="80" y="55" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#e8ecef">Untitled Studio</text>
  <text x="624" y="55" text-anchor="end" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="13" fill="#8d979e">Version {{VERSION}}</text>
  <rect x="36" y="76" width="588" height="1" fill="#ffffff" fill-opacity="0.08"/>

  <!-- arrow from the app to Applications -->
  <g fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 200 C 300 172, 360 172, 398 200"/>
    <path d="M 380 186 L 400 201 L 377 211"/>
  </g>

  <!-- step-sequencer row, two steps lit -->
  <g transform="translate(234 300)">
    <rect x="0"   y="0" width="34" height="18" rx="4" fill="#e8ecef"/>
    <rect x="40"  y="0" width="34" height="18" rx="4" fill="#4c555c"/>
    <rect x="80"  y="0" width="34" height="18" rx="4" fill="#5c4a4d"/>
    <rect x="120" y="0" width="34" height="18" rx="4" fill="#e8ecef"/>
    <rect x="160" y="0" width="34" height="18" rx="4" fill="#4c555c"/>
  </g>

  <text x="330" y="356" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="14" fill="#c4cbd0">Drag <tspan fill="#ffb466" font-weight="bold">Untitled Studio</tspan> into Applications to install</text>
  <text x="330" y="378" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="11" fill="#6f7a82">Free software · GPLv3 · github.com/kkorenn/UntitledStudio</text>
</svg>
