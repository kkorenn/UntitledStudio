<?xml version="1.0" encoding="UTF-8"?>
<!-- Untitled Studio installer (DMG) window background, 660x560 (artwork in the top 420; the rest is margin that newer Finder
     versions cover with their toolbar / path bar / status bar). Original artwork.
     scripts/dist.sh replaces {{VERSION}} and renders 1x + 2x.
     Finder draws icon labels in black, so the icons sit on a light card. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353d43"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#e2e6e9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb466"/>
      <stop offset="1" stop-color="#f07a1e"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip"><rect x="28" y="84" width="604" height="226" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="660" height="560" fill="url(#bg)"/>
  <rect width="660" height="560" fill="url(#grid)"/>

  <!-- header -->
  <g transform="translate(36 26)">
    <path d="M 7 4 V 16 A 10 10 0 0 0 27 16 V 4" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="27" cy="4" r="3" fill="#7cd85a"/>
  </g>
  <text x="80" y="51" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#e8ecef">Untitled Studio</text>
  <text x="624" y="51" text-anchor="end" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="13" fill="#8d979e">Version {{VERSION}}</text>

  <!-- light card behind the two icons (Finder places them at 170,190 and 490,190) -->
  <rect x="28" y="84" width="604" height="226" rx="18" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="28" y="84" width="604" height="5" fill="url(#mark)" clip-path="url(#cardClip)"/>

  <!-- arrow from the app to Applications -->
  <g fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 258 186 C 298 156, 362 156, 402 186"/>
    <path d="M 397.8 168.5 L 404 187.5 L 384 186.9" stroke="#f07a1e"/>
  </g>

  <!-- step-sequencer row, two steps lit -->
  <g transform="translate(270 334)">
    <rect x="0"   y="0" width="20" height="11" rx="3" fill="#e8ecef"/>
    <rect x="25"  y="0" width="20" height="11" rx="3" fill="#4c555c"/>
    <rect x="50"  y="0" width="20" height="11" rx="3" fill="#5c4a4d"/>
    <rect x="75"  y="0" width="20" height="11" rx="3" fill="#e8ecef"/>
    <rect x="100" y="0" width="20" height="11" rx="3" fill="#4c555c"/>
  </g>

  <text x="330" y="372" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="14" fill="#c4cbd0">Drag <tspan fill="#ffb466" font-weight="bold">Untitled Studio</tspan> into Applications to install</text>
  <text x="330" y="396" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="11" fill="#6f7a82">Free software · GPLv3 · github.com/kkorenn/UntitledStudio</text>
</svg>
